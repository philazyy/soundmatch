<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soundmatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="Lobby">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <h1>Soundmatch</h1>
            <p id="lobbyCode">Lobby ----</p>
          </div>
        </div>

        <button class="primary wide" id="newLobbyBtn" type="button">
          <span aria-hidden="true">＋</span>
          Neue Lobby
        </button>

        <section class="panel lobby-panel">
          <div class="panel-head">
            <h2>Teilen</h2>
            <span id="syncStatus">lokal</span>
          </div>
          <input id="lobbyLink" readonly aria-label="Lobby-Link" />
          <button class="secondary wide" id="copyLobbyBtn" type="button">
            <span aria-hidden="true">⧉</span>
            Link kopieren
          </button>
          <form id="joinLobbyForm" class="inline-form">
            <input id="joinCode" autocomplete="off" maxlength="12" placeholder="Lobby-Code" />
            <button type="submit" title="Lobby beitreten" aria-label="Lobby beitreten">→</button>
          </form>
        </section>

        <section class="panel spotify-panel">
          <div class="panel-head">
            <h2>Spotify</h2>
            <span id="spotifyStatus">offline</span>
          </div>
          <input id="clientIdInput" autocomplete="off" placeholder="Spotify Client ID" />
          <button class="primary wide" id="spotifyLoginBtn" type="button">
            <span aria-hidden="true">●</span>
            Mit Spotify anmelden
          </button>
          <button class="secondary wide" id="importSpotifyBtn" type="button">
            <span aria-hidden="true">↓</span>
            Top-Songs importieren
          </button>
          <button class="ghost wide" id="spotifyLogoutBtn" type="button">Account wechseln</button>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Spieler</h2>
            <span id="playerCount">0</span>
          </div>
          <form id="playerForm" class="inline-form">
            <input id="playerName" autocomplete="off" maxlength="18" placeholder="Name" />
            <button type="submit" title="Spieler hinzufügen" aria-label="Spieler hinzufügen">＋</button>
          </form>
          <div id="players" class="players"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Runden</h2>
            <span id="roundCount">0</span>
          </div>
          <div class="stat-grid">
            <div>
              <strong id="playlistCount">0</strong>
              <span>Matches</span>
            </div>
            <div>
              <strong id="deckCount">0</strong>
              <span>Offen</span>
            </div>
          </div>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <nav class="tabs" aria-label="Ansichten">
            <button class="tab active" data-view="setup" type="button">Lobby</button>
            <button class="tab" data-view="swipe" type="button">Swipe</button>
            <button class="tab" data-view="playlist" type="button">Playlist</button>
          </nav>
          <button class="ghost" id="resetBtn" type="button" title="Daten zurücksetzen" aria-label="Daten zurücksetzen">↺</button>
        </header>

        <section id="setupView" class="view active">
          <div class="split">
            <section class="workspace">
              <div class="section-title">
                <h2>Top-Songs wählen</h2>
                <button class="primary" id="startRoundBtn" type="button">
                  <span aria-hidden="true">▶</span>
                  Runde starten
                </button>
              </div>
              <div id="songLibrary" class="song-grid"></div>
            </section>

            <aside class="queue">
              <div class="section-title compact">
                <h2>Deck</h2>
                <button class="ghost text" id="shuffleBtn" type="button">Mischen</button>
              </div>
              <div id="roundDeck" class="deck-list"></div>
            </aside>
          </div>
        </section>

        <section id="swipeView" class="view">
          <div id="swipeStage" class="swipe-stage"></div>
        </section>

        <section id="playlistView" class="view">
          <div class="playlist-head">
            <div>
              <h2>Gruppen-Playlist</h2>
              <p id="playlistMeta">Noch keine Matches</p>
            </div>
            <div class="actions">
            <button class="secondary" id="copyBtn" type="button">
              <span aria-hidden="true">⧉</span>
              Kopieren
            </button>
            <button class="secondary" id="createSpotifyPlaylistBtn" type="button">
              <span aria-hidden="true">♬</span>
              In Spotify erstellen
            </button>
            <button class="primary" id="continueBtn" type="button">
              <span aria-hidden="true">＋</span>
              Weitere Runde
            </button>
            </div>
          </div>
          <p id="playlistLink" class="playlist-link"></p>
          <div id="playlist" class="playlist"></div>
        </section>
      </main>
    </div>

    <template id="emptyTemplate">
      <div class="empty">
        <div class="empty-icon">♪</div>
        <h3></h3>
        <p></p>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
